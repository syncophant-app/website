<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Onest Variable"; src: url("assets/Onest-Variable.woff2") format("woff2"); font-weight: 100 900; }
        #v4-root { position: absolute; inset: 0; color: #0a0a0a; font-family: "Onest Variable", sans-serif; overflow: hidden; }
        #v4-root .bg { position: absolute; inset: 0; background: radial-gradient(60% 50% at 18% 12%, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%), radial-gradient(55% 55% at 88% 86%, rgba(255,255,255,0.75), rgba(255,255,255,0) 70%), #eef1f6; }
        #v4-root .h { position: absolute; left: 120px; right: 120px; top: 230px; font-size: 68px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.08; }
        #v4-root .s { position: absolute; left: 120px; right: 160px; top: 418px; font-size: 32px; font-weight: 400; color: #5a6372; line-height: 1.35; }
        /* A direct line from the Mac to the storage: nothing in between. */
        #v4-root .diagram { position: absolute; left: 120px; top: 640px; width: 840px; height: 160px; }
        #v4-root .node { position: absolute; top: 0; width: 220px; height: 160px; border-radius: 28px; background: #ffffff; box-shadow: 0 0 0 1px rgba(10,10,10,0.1), 0 16px 40px -18px rgba(10,26,51,0.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-size: 24px; font-weight: 500; }
        #v4-root .node svg { width: 52px; height: 52px; }
        #v4-root .n1 { left: 0; }
        #v4-root .n2 { right: 0; }
        #v4-root .link { position: absolute; left: 220px; top: 0; width: 400px; height: 160px; }
      </style>
      <div id="v4-root" data-composition-id="v3-private" data-width="1080" data-height="1080">
        <div id="v4-bg" class="bg clip" data-start="0" data-duration="3.6" data-track-index="0"></div>
        <div class="h"><span style="display:block">No account.</span><span style="display:block">No Syncophant server.</span></div>
        <div class="s">Your Mac connects straight to your storage. Passwords stay in your Keychain.</div>
        <div class="diagram">
          <div class="node n1"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.75" y="4.75" width="16.5" height="11.5" rx="2"/><path d="M9 20h6M12 16.25V20"/></svg>Your Mac</div>
          <svg class="link" viewBox="0 0 400 160"><line class="ln" x1="24" y1="80" x2="376" y2="80" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" /></svg>
          <div class="node n2"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.75" y="7.25" width="16.5" height="9.5" rx="2.25"/><path d="M7 13.5h.01M10 13.5h.01"/></svg>Your storage</div>
        </div>
      </div>
      <script>
        (function () {
          const q = (s) => "#v4-root " + s;
          const ln = document.querySelector("#v4-root .ln");
          const E = "power3.out";
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".h"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: E }, 0.15);
          tl.fromTo(q(".s"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: E }, 0.5);
          tl.fromTo(q(".n1"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 0.6);
          tl.fromTo(q(".n2"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 0.8);
          tl.fromTo(ln, { attr: { x2: 24 } }, { attr: { x2: 376 }, duration: 0.9, ease: "power2.inOut" }, 1.2);
          tl.to(q(".h, .s, .diagram"), { opacity: 0, y: -16, duration: 0.45, ease: "power2.in" }, 3.6 - 0.45);
          window.__timelines["v3-private"] = tl;
        })();
      </script>
    </template>
