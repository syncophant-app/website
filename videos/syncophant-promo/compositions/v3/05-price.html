<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Onest Variable"; src: url("assets/Onest-Variable.woff2") format("woff2"); font-weight: 100 900; }
        #v5-root { position: absolute; inset: 0; color: #0a0a0a; font-family: "Onest Variable", sans-serif; overflow: hidden; }
        #v5-root .bg { position: absolute; inset: 0; background: radial-gradient(60% 50% at 18% 12%, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%), radial-gradient(55% 55% at 88% 86%, rgba(255,255,255,0.75), rgba(255,255,255,0) 70%), #eef1f6; }
        #v5-root .k { position: absolute; left: 120px; top: 260px; font-size: 32px; font-weight: 500; color: #5a6372; }
        #v5-root .card { position: absolute; left: 120px; right: 120px; top: 340px; padding: 56px 60px; border-radius: 36px; background: #ffffff; box-shadow: 0 0 0 1px rgba(10,10,10,0.08), 0 24px 60px -28px rgba(10,26,51,0.25); }
        #v5-root .p1 { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; }
        #v5-root .p2 { margin-top: 18px; font-size: 128px; font-weight: 650; letter-spacing: -0.05em; line-height: 1; }
        #v5-root .p2 span { font-size: 40px; font-weight: 500; letter-spacing: -0.01em; color: #5a6372; margin-left: 14px; }
        #v5-root .rule { margin-top: 36px; height: 1px; background: #d5dbe4; transform-origin: 0% 50%; }
        #v5-root .p3 { margin-top: 30px; font-size: 30px; font-weight: 400; color: #5a6372; }
      </style>
      <div id="v5-root" data-composition-id="v3-price" data-width="1080" data-height="1080">
        <div id="v5-bg" class="bg clip" data-start="0" data-duration="3.6" data-track-index="0"></div>
        <div class="k">Need storage?</div>
        <div class="card">
          <div class="p1">1 TB Hetzner Storage Box</div>
          <div class="p2">€3.81<span>a month</span></div>
          <div class="rule"></div>
          <div class="p3">Set up in one step in Syncophant.</div>
        </div>
      </div>
      <script>
        (function () {
          const q = (s) => "#v5-root " + s;
          const E = "power3.out";
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".k"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: E }, 0.1);
          tl.fromTo(q(".card"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: E }, 0.3);
          tl.fromTo(q(".p2"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: E }, 0.6);
          tl.fromTo(q(".rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 1.2);
          tl.fromTo(q(".p3"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, 1.5);
          tl.to(q(".k, .card"), { opacity: 0, y: -16, duration: 0.45, ease: "power2.in" }, 3.6 - 0.45);
          window.__timelines["v3-price"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
