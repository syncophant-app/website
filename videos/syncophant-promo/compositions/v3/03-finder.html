            tl.fromTo(q(sel + " .cs"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: E }, at + 0.25);
          };
          const capOut = (sel, at) => tl.to(q(sel), { opacity: 0, y: -12, duration: 0.4, ease: "power2.in" }, at - 0.4);

          // Initial state: Macintosh HD selected, the drive not yet mounted.
          tl.set(q(".t-box, .l-box, .path"), { opacity: 0 }, 0);
          tl.set(q(".s-ver, .s-ok"), { opacity: 0 }, 0);

          // Beat 1 (0–3.74): the window settles; Storage Box appears under Macintosh HD.
          tl.fromTo(q(".win"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.0, ease: E }, 0);
          capIn(".c1", 0.3);
          tl.fromTo(q(".r-box"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.7, ease: E }, 1.2);
          tl.fromTo(q(".cursor"), { x: 760, y: 1120 }, { x: 232, y: 788, duration: 0.7, ease: "power2.inOut" }, 1.7);
          tl.to(q(".cursor"), { scale: 0.9, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "10% 10%" }, 2.405);
          tl.to(q(".sel"), { y: 46, duration: 0.35, ease: E }, 2.42);
          tl.to(q(".t-mac"), { opacity: 0, duration: 0.25 }, 2.45);
          tl.to(q(".t-box"), { opacity: 1, duration: 0.35 }, 2.55);
          tl.to(q(".l-mac"), { opacity: 0, duration: 0.25 }, 2.45);
          tl.set(q(".l-box"), { opacity: 1 }, 2.55);
          // The new row's slot is held empty until the upload beat.
          tl.set(q(".r-new"), { opacity: 0 }, 0);
          tl.set(q(".old"), { y: -56 }, 0);
          tl.fromTo(q(".old"), { opacity: 0 }, { opacity: 1, duration: 0.45, stagger: 0.08, ease: "power2.out" }, 2.55);
          tl.to(q(".path"), { opacity: 1, duration: 0.4 }, 2.8);
          tl.to(q(".cursor"), { x: 1150, y: 1150, duration: 0.9, ease: "power2.in" }, 2.9);

          // Beat 2 (3.74–6.9): files stay on your storage.
          capOut(".c1", 3.608);
          capIn(".c2", 3.608);
          tl.fromTo(q(".old .sv"), { opacity: 0.35 }, { opacity: 1, duration: 0.5, stagger: 0.18, ease: "power2.out" }, 3.9);

          // Beat 3 (6.9–10.5): a new file arrives, uploads, is verified.
          capOut(".c2", 6.013);
          capIn(".c3", 6.013);
          tl.to(q(".old"), { y: 0, duration: 0.6, ease: E }, 6.013);
          tl.fromTo(q(".r-new"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 6.15);
          const up = { v: 0 };
          tl.fromTo(up, { v: 0 }, { v: 100, duration: 1.1, ease: "power1.inOut", onUpdate: () => { pct.textContent = "Uploading " + Math.round(up.v) + "%"; } }, 6.4);
          tl.fromTo(q(".prog i"), { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "power1.inOut" }, 6.4);
          tl.to(q(".s-up, .prog"), { opacity: 0, duration: 0.2 }, 7.5);
          tl.to(q(".s-ver"), { opacity: 1, duration: 0.2 }, 7.52);
          tl.to(q(".s-ver"), { opacity: 0, duration: 0.2 }, 7.8);
          tl.to(q(".s-ok"), { opacity: 1, duration: 0.3 }, 7.817);
          tl.fromTo(q(".r-new"), { backgroundColor: "rgba(10,10,10,0)" }, { backgroundColor: "rgba(10,10,10,0.06)", duration: 0.5, ease: "power2.out", immediateRender: false }, 7.817);

          // Exit: the window and caption step back before the next beat.
          tl.to(q(".win, .caps"), { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 9.59 - 0.5);
          window.__timelines["v3-finder"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
