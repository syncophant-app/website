          };
          const capOut = (sel, at) => tl.to(q(sel), { opacity: 0, y: -30, duration: 0.12, ease: "power2.in" }, at - 0.12);

          // Bar 1: the window rises in, showing Macintosh HD.
          tl.fromTo(q(".win"), { opacity: 0, y: 220, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 0);
          tl.fromTo(q(".sel"), { y: 0 }, { y: 0, duration: 0.01 }, 0);
          tl.set(q(".t-box"), { opacity: 0 }, 0);
          tl.set(q(".l-box"), { opacity: 0 }, 0);
          tl.set(q(".path"), { opacity: 0 }, 0);
          capIn(".c1", 0.02);
          // The drive mounts right under Macintosh HD.
          tl.fromTo(q(".r-box"), { opacity: 0, x: -80, scale: 0.85 }, { opacity: 1, x: 0, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, 2 * B);
          tl.fromTo(q(".ring"), { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 2 * B + 0.1);
          tl.to(q(".ring"), { opacity: 0, duration: 0.25 }, 2 * B + 0.55);

          // Bar 2: click it. It opens like any other drive.
          capOut(".c1", 4 * B);
          capIn(".c2", 4 * B);
          tl.fromTo(q(".cursor"), { x: 700, y: 1100 }, { x: 250, y: 790, duration: 0.35, ease: "power3.out" }, 3 * B);
          tl.to(q(".cursor"), { scale: 0.85, duration: 0.05, yoyo: true, repeat: 1, transformOrigin: "10% 10%" }, 4 * B - 0.02);
          tl.to(q(".sel"), { y: 50, duration: 0.14, ease: "power3.out" }, 4 * B);
          tl.to(q(".t-mac"), { opacity: 0, y: -16, duration: 0.1 }, 4 * B);
          tl.fromTo(q(".t-box"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.14 }, 4 * B + 0.04);
          tl.to(q(".l-mac"), { opacity: 0, duration: 0.08 }, 4 * B);
          tl.set(q(".l-box"), { opacity: 1 }, 4 * B + 0.06);
          tl.fromTo(q(".l-box .fr"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.18, stagger: 0.06, ease: "power3.out" }, 4 * B + 0.06);
          tl.fromTo(q(".path"), { opacity: 0 }, { opacity: 1, duration: 0.15 }, 4 * B + 0.2);
          tl.to(q(".cursor"), { x: 1150, y: 1150, duration: 0.4, ease: "power2.in" }, 5 * B);

          // Bar 3: the thesis uploads, verifies, and lands safely.
          capOut(".c2", 8 * B);
          capIn(".c3", 8 * B);
          tl.fromTo(q(".foot"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 6 * B);
          tl.set(q(".s-ver, .s-ok"), { opacity: 0 }, 0);
          const up = { v: 0 };
          tl.fromTo(up, { v: 0 }, { v: 100, duration: 1.0, ease: "power1.inOut", onUpdate: () => { pct.textContent = "Uploading " + Math.round(up.v) + "%"; } }, 4 * B + 0.3);
          tl.fromTo(q(".prog i"), { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power1.inOut" }, 4 * B + 0.3);
          tl.set(q(".s-up, .prog"), { opacity: 0 }, 4 * B + 1.32);
          tl.set(q(".s-ver"), { opacity: 1 }, 4 * B + 1.32);
          tl.set(q(".s-ver"), { opacity: 0 }, 10 * B);
          tl.fromTo(q(".s-ok"), { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(3)", transformOrigin: "0% 50%" }, 10 * B);
          tl.fromTo(q(".r-thesis"), { backgroundColor: "rgba(10,95,219,0)" }, { backgroundColor: "rgba(10,95,219,0.14)", duration: 0.12, yoyo: true, repeat: 1 }, 10 * B);
          window.__timelines["f06-finder"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
