    <template>
      <style>

        #f07-root { position: absolute; inset: 0; color: #ffffff; font-family: "Onest Variable", sans-serif; overflow: hidden; }
        #f07-root .bg { position: absolute; inset: 0; background: #0a0a0a; }
        #f07-root .l { position: absolute; left: 72px; white-space: nowrap; letter-spacing: -0.045em; line-height: 0.9; transform-origin: 0% 60%; }

        #f07-root .l3 { top: 410px; font-size: 150px; font-weight: 900; color: #4DA3FF; }

        #f07-root .nosee { position: absolute; left: 270px; top: 660px; font-size: 66px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; white-space: nowrap; }
        #f07-root .fine { position: absolute; left: 270px; top: 750px; font-size: 32px; font-weight: 500; color: #a1a9b6; line-height: 1.3; }
      </style>
      <div id="f07-root" data-composition-id="f07-private" data-width="1080" data-height="1080">
        <div id="f07-bg" class="bg clip" data-start="0" data-duration="3.2" data-track-index="0"></div>
        <div class="l l1">the dropbox of 2026.</div>
        <div class="l l2">except it's</div>
        <div class="l l3">yours.</div>
        <svg class="lock" viewBox="0 0 22 26" fill="#ffffff"><path class="shackle" d="M5 11V7a6 6 0 0 1 12 0v4h-3V7a3 3 0 0 0-6 0v4z" /><path d="M4 11h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V13a2 2 0 0 1 2-2z" /></svg>
        <div class="nosee">no one else sees it.</div>
        <div class="fine">no account. no server in between.<span style="display:block">just your Mac and your storage.</span></div>
        <audio id="f07-sfx-whoosh" data-hf-media-start-basis="local" src="assets/sfx/whoosh.wav" data-start="0" data-duration="0.35" data-volume="0.35"></audio>
        <audio id="f07-sfx-impact" data-hf-media-start-basis="local" src="assets/sfx/impact.wav" data-start="0.8" data-duration="0.9" data-volume="0.6"></audio>

      </div>
      <script>
        (function () {
          const B = 0.4;
          const q = (s) => "#f07-root " + s;
          const tl = gsap.timeline({ paused: true });
          const slam = (sel, at) =>
            tl.fromTo(q(sel), { opacity: 0, scale: 1.6, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, at);
          slam(".l1", 0.02);
          slam(".l2", B);
          slam(".l3", 2 * B);
          tl.fromTo(q(".l3"), { fontWeight: 200 }, { fontWeight: 900, duration: 0.3, ease: "power2.out" }, 2 * B);
          tl.fromTo(q(".lock"), { opacity: 0, y: -420 }, { opacity: 1, y: 0, duration: 0.32, ease: "bounce.out" }, 3 * B);
          tl.fromTo(q(".shackle"), { y: -4 }, { y: 0, duration: 0.08, ease: "power4.in" }, 4 * B);
          tl.to(q(".lock"), { keyframes: [{ rotation: -7 }, { rotation: 6 }, { rotation: 0 }], duration: 0.16, ease: "none" }, 4 * B + 0.08);
          slam(".nosee", 4 * B + 0.1);
          tl.fromTo(q(".fine"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.22, ease: "power3.out" }, 5.5 * B);
          tl.to(q(".l, .lock, .nosee, .fine"), { y: "-=40", opacity: 0, duration: 0.16, ease: "power3.in" }, 3.2 - 0.16);
          window.__timelines["f07-private"] = tl;
        })();
