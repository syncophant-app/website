    <template>
      <style>
        @font-face { font-family: "Onest Variable"; src: url("assets/Onest-Variable.woff2") format("woff2"); font-weight: 100 900; }
        #f01-root { position: absolute; inset: 0; color: #ffffff; font-family: "Onest Variable", sans-serif; overflow: hidden; }
        #f01-root .bg { position: absolute; inset: 0; background: #0a0a0a; }
        #f01-root .stack { position: absolute; left: 72px; right: 72px; top: 220px; display: flex; flex-direction: column; gap: 6px; transform-origin: 30% 50%; }
        #f01-root .line { display: block; white-space: nowrap; line-height: 0.9; letter-spacing: -0.04em; text-transform: lowercase; transform-origin: 0% 60%; }
        #f01-root .l1 { font-size: 120px; font-weight: 300; color: #a1a9b6; }
        #f01-root .l2 { font-size: 200px; font-weight: 900; }
        #f01-root .l3 { font-size: 120px; font-weight: 300; color: #a1a9b6; margin-top: 18px; }
        #f01-root .l4 { font-size: 200px; font-weight: 900; color: #4DA3FF; display: flex; align-items: center; gap: 28px; }
        #f01-root .bookmark { width: 104px; height: 140px; display: block; }
        #f01-root .tag { position: absolute; right: 72px; top: 72px; font-size: 26px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #a1a9b6; }
      </style>
      <div data-hf-id="hf-w4ox" id="f01-root" data-composition-id="f01-hack" data-width="1080" data-height="1080">
        <div data-hf-id="hf-ldlv" id="f01-bg" class="bg clip" data-start="0" data-duration="3.2" data-track-index="0"></div>
        <div data-hf-id="hf-d1zs" class="stack">
          <span data-hf-id="hf-0jyr" class="line l1">here's a</span>
          <span data-hf-id="hf-n04z" class="line l2">mac hack</span>
          <span data-hf-id="hf-tpw9" class="line l3">you'll want to</span>
          <span data-hf-id="hf-xos2" class="line l4">save.
            <svg data-hf-id="hf-3l4e" class="bookmark" viewBox="0 0 24 32" fill="#4DA3FF"><path data-hf-id="hf-acay" d="M2 0h20a2 2 0 0 1 2 2v30l-12-8-12 8V2a2 2 0 0 1 2-2z" /></svg>
          </span>
        </div>
        <div data-hf-id="hf-krwi" class="tag">(seriously. save it.)</div>
        <audio id="f01-sfx-impact-1" data-hf-media-start-basis="local" src="assets/sfx/impact.wav" data-start="0.4" data-duration="0.9" data-volume="0.45"></audio>
        <audio id="f01-sfx-impact-2" data-hf-media-start-basis="local" src="assets/sfx/impact.wav" data-start="1.6" data-duration="0.9" data-volume="0.5"></audio>
        <audio id="f01-sfx-pop" data-hf-media-start-basis="local" src="assets/sfx/pop.wav" data-start="2.1" data-duration="0.14" data-volume="0.8"></audio>
      </div>
      <script>
        (function () {
          const B = 0.4;
          const q = (s) => "#f01-root " + s;
          const tl = gsap.timeline({ paused: true });
          const slam = (sel, at, from) =>
            tl.fromTo(q(sel), Object.assign({ opacity: 0, scale: 1.7, filter: "blur(14px)" }, from || {}),
              { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, at);
          slam(".l1", 0.02, { y: -40 });
          slam(".l2", B, {});
          tl.fromTo(q(".l2"), { fontWeight: 100 }, { fontWeight: 900, duration: 0.3, ease: "power2.out" }, B);
          slam(".l3", 3 * B, { y: 30 });
          slam(".l4", 4 * B, {});
          tl.fromTo(q(".l4"), { fontWeight: 100 }, { fontWeight: 900, duration: 0.3, ease: "power2.out" }, 4 * B);
          tl.fromTo(q(".bookmark"), { y: -700, rotation: -18 }, { y: 0, rotation: 0, duration: 0.3, ease: "bounce.out" }, 5 * B);
          tl.fromTo(q(".tag"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, 5.75 * B);
          // Slow push across the frame, then a hard push out into the cut.
          tl.fromTo(q(".stack"), { scale: 1, y: 0, opacity: 1 }, { scale: 1.04, duration: 3.0, ease: "none" }, 0);
          tl.to(q(".stack"), { scale: 1.25, y: -60, opacity: 0, duration: 0.16, ease: "power3.in" }, 3.2 - 0.16);
          window.__timelines["f01-hack"] = tl;
        })();
      </script>
