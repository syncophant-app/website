<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Onest Variable"; src: url("assets/Onest-Variable.woff2") format("woff2"); font-weight: 100 900; }
        #f08-root { position: absolute; inset: 0; color: #0a0a0a; font-family: "Onest Variable", sans-serif; overflow: hidden; }
        #f08-root .bg { position: absolute; inset: 0; background: #ffffff; }
        #f08-root .psst { position: absolute; left: 72px; top: 72px; font-size: 40px; font-weight: 400; color: #5a6372; letter-spacing: -0.01em; transform-origin: 0% 50%; }
        #f08-root .psst b { color: #0a0a0a; font-weight: 700; }
        #f08-root .tb { position: absolute; left: 60px; top: 150px; font-size: 300px; font-weight: 900; letter-spacing: -0.06em; line-height: 0.85; transform-origin: 0% 60%; }
        #f08-root .price { position: absolute; left: 66px; top: 450px; width: 948px; height: 200px; overflow: hidden; transform-origin: 0% 50%; }
        #f08-root .pv { position: absolute; left: 0; top: 0; font-size: 230px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.85; color: #0A5FDB; white-space: nowrap; }
        #f08-root .per { position: absolute; left: 76px; top: 660px; font-size: 54px; font-weight: 700; letter-spacing: -0.02em; }
        #f08-root .alt { position: absolute; right: 72px; top: 676px; font-size: 36px; font-weight: 500; color: #5a6372; }
        #f08-root .rule { position: absolute; left: 72px; right: 72px; top: 776px; height: 1px; background: #d5dbe4; transform-origin: 0% 50%; }
        #f08-root .who { position: absolute; left: 72px; right: 72px; top: 812px; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
        #f08-root .wl { display: block; }
        #f08-root .wl.dim { font-weight: 400; color: #5a6372; }
        #f08-root .luck { position: absolute; left: 72px; bottom: 64px; font-size: 26px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #0A5FDB; }
      </style>
      <div id="f08-root" data-composition-id="f08-deal" data-width="1080" data-height="1080">
        <div id="f08-bg" class="bg clip" data-start="0" data-duration="3.2" data-track-index="0"></div>
        <div class="psst">psst. <b>no storage?</b></div>
        <div class="tb">1 TB</div>
        <div class="price" data-layout-allow-overlap data-layout-allow-overflow data-layout-allow-occlusion>
          <div class="pv eur">€3.81</div>
          <div class="pv usd">$4.27</div>
          <div class="pv inr">₹403.66</div>
          <div class="pv eur2">€3.81</div>
        </div>
        <div class="per">/month</div>
        <div class="alt">$4.27 · ₹403.66</div>
        <div class="rule"></div>
        <div class="who"><span class="wl">hetzner storage box.</span><span class="wl dim">one-step setup in syncophant.</span></div>
        <div class="luck">good luck beating that.</div>
        <audio id="f08-sfx-impact" data-hf-media-start-basis="local" src="assets/sfx/impact.wav" data-start="0.4" data-duration="0.9" data-volume="0.6"></audio>
        <audio id="f08-sfx-flap-1" data-hf-media-start-basis="local" src="assets/sfx/flap.wav" data-start="0.8" data-duration="0.12" data-volume="0.7"></audio>
        <audio id="f08-sfx-flap-2" data-hf-media-start-basis="local" src="assets/sfx/flap.wav" data-start="1.2" data-duration="0.12" data-volume="0.7"></audio>
        <audio id="f08-sfx-flap-3" data-hf-media-start-basis="local" src="assets/sfx/flap.wav" data-start="1.4" data-duration="0.12" data-volume="0.7"></audio>
        <audio id="f08-sfx-cash" data-hf-media-start-basis="local" src="assets/sfx/cash.wav" data-start="1.6" data-duration="0.8" data-volume="0.7"></audio>
      </div>
      <script>
        (function () {
          const B = 0.4;
          const q = (s) => "#f08-root " + s;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".psst"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 0.02);
          tl.fromTo(q(".tb"), { opacity: 0, scale: 2.6, filter: "blur(16px)", fontWeight: 300 }, { opacity: 1, scale: 1, filter: "blur(0px)", fontWeight: 900, duration: 0.26, ease: "expo.out" }, B);
          // Split-flap price: €, then the snare roll flips $ and ₹, then back to € on the downbeat (cha-ching).
          const flips = [[".eur", 2 * B], [".usd", 3 * B], [".inr", 3.5 * B], [".eur2", 4 * B]];
          flips.forEach(([sel, at], i) => {
            tl.fromTo(q(sel), { yPercent: 150 }, { yPercent: 0, duration: 0.1, ease: "power3.out" }, at);
            if (i < flips.length - 1) tl.to(q(sel), { yPercent: -150, duration: 0.1, ease: "power3.in" }, flips[i + 1][1] - 0.02);
          });
          tl.fromTo(q(".per"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.18 }, 2 * B + 0.1);
          tl.fromTo(q(".price"), { scale: 1.12 }, { scale: 1, duration: 0.25, ease: "expo.out", immediateRender: false }, 4 * B);
          tl.fromTo(q(".alt"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.18 }, 4.5 * B);
          tl.fromTo(q(".rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 5 * B);
          tl.fromTo(q(".wl"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.2, stagger: 0.14, ease: "power3.out" }, 5 * B);
          tl.fromTo(q(".luck"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out" }, 6.5 * B);
          window.__timelines["f08-deal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
